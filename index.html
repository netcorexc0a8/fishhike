<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0B1220" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#EEF2EF" media="(prefers-color-scheme: light)" />
    <meta name="description" content="FishHike — прогноз клёва, сборы, походные рецепты и места" />
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <!-- Через src/assets: Vite добавляет хэш к имени, и при смене иконки меняется адрес.
         Иначе iOS и service worker отдают закэшированную старую картинку. -->
    <link rel="apple-touch-icon" href="/src/assets/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="FishHike" />
    <title>FishHike</title>
    <script>
      // Применяем выбранную тему до отрисовки, чтобы не мигала другая (см. src/lib/theme.ts).
      try {
        var t = localStorage.getItem('fishhike-theme');
        if (t === 'light' || t === 'dark') {
          document.documentElement.dataset.theme = t;
          var c = t === 'light' ? '#EEF2EF' : '#0B1220';
          document.querySelectorAll('meta[name="theme-color"]').forEach(function (m) { m.content = c; });
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
